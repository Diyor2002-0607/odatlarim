<body>
<header><span id="ttl">Odatlar</span><button id="srt" aria-label="Saralash">⇅</button><button id="add" aria-label="Odat qoʻshish">+</button><button id="mnu" aria-label="Menyu">⋮</button></header>
<main id="app"></main>
<nav><button id="n0"><b>☰</b>Qaydlar</button><button id="n1"><b>✓</b>Asosiy</button><button id="n2"><b>◷</b>Pomidor</button></nav>
<div id="md"></div><div id="dt"></div><div id="fm"></div>
<script>
const $=s=>document.querySelector(s),DN=['DUSH','SESH','CHOR','PAY','JUM','SHAN','YAK'],DS=['Du','Se','Ch','Pa','Ju','Sh','Ya'],MN=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktabr','noyabr','dekabr'];
const UN=['daqiqa','soat','marta','sahifa','stakan','ml','litr','km'];
const CL=['blue','green','pink','orange','violet','teal','yellow','red'],CN={blue:'Koʻk',green:'Yashil',pink:'Pushti',orange:'Toʻq sariq',violet:'Binafsha',teal:'Moviy',yellow:'Sariq',red:'Qizil'};
const hk=h=>CL.includes(h.color)?h.color:'blue',hc=h=>'var(--c-'+hk(h)+')';
const gk=(h,d)=>{if(!h.group||!h.subs)return 0;const c=get(h,d);return c&&c.d?h.subs.filter(z=>c.d[z.id]).length:0};
const gfull=(h,d)=>!!(h.group&&h.subs&&h.subs.length&&gk(h,d)===h.subs.length);
const fillP=(h,d)=>cellInfo(h,d).f;
let S={habits:[],logs:{},notes:{},tasks:[],sessions:[],set:{theme:'dark',focus:25,brk:5},timer:null};
try{const r=localStorage.getItem('odat2');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
if(!Array.isArray(S.habits))S.habits=[];if(!S.logs||typeof S.logs!=='object'||Array.isArray(S.logs))S.logs={};if(!Array.isArray(S.sessions))S.sessions=[];if(!S.notes||typeof S.notes!=='object'||Array.isArray(S.notes))S.notes={};if(!Array.isArray(S.tasks))S.tasks=[];if(!S.set||typeof S.set!=='object')S.set={theme:'dark',focus:25,brk:5};
const save=()=>{try{localStorage.setItem('odat2',JSON.stringify(S))}catch(e){}syncR()};
/* Telegram Mini App */
const TG=(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)?Telegram.WebApp:null;
const tgv=v=>!!(TG&&TG.isVersionAtLeast&&TG.isVersionAtLeast(v));
if(TG){try{TG.ready();TG.expand();if(tgv('7.7'))TG.disableVerticalSwipes()}catch(e){}
  if(!S.set.themeSet&&(TG.colorScheme==='light'||TG.colorScheme==='dark'))S.set.theme=TG.colorScheme;
  try{TG.onEvent('themeChanged',()=>{if(!S.set.themeSet&&TG.colorScheme!==S.set.theme){S.set.theme=TG.colorScheme;render()}})}catch(e){}}
function cf(m,fn){if(tgv('6.2')){try{TG.showConfirm(m,ok=>{if(ok)fn()});return}catch(e){}}if(confirm(m))fn()}
function al(m){if(tgv('6.2')){try{TG.showAlert(m);return}catch(e){}}alert(m)}
function hap(t){try{if(tgv('6.1'))TG.HapticFeedback.notificationOccurred(t||'success')}catch(e){}}
/* eslatmalarni serverga (bot) yuborish */
let SY_T=null,SY_LAST='',SY_ST={ok:null,err:''},WA=false;
async function api(p,body){const b=JSON.stringify(Object.assign({initData:TG.initData},body));
  const r=await fetch('/api/'+p,{method:'POST',headers:{'content-type':'application/json'},body:b,keepalive:b.length<60000});
  let j={};try{j=await r.json()}catch(e){}if(!r.ok&&!j.err)j.err='HTTP '+r.status;return j}
function syncPayload(){const t=today(),k=ds(t),now=Date.now();return{tz:(Intl.DateTimeFormat().resolvedOptions().timeZone)||'',off:-t.getTimezoneOffset(),
  habits:S.habits.filter(h=>h.time).map(h=>({id:h.id,name:h.name,time:h.time,days:h.days,done:get(h,t)?[k]:[]})),
  tasks:(S.tasks||[]).filter(x=>x.notify&&x.due&&!x.done).map(x=>({id:x.id,title:x.title,at:new Date(x.due).getTime()})).filter(x=>x.at>now-6*3600e3),
  timer:S.timer&&S.timer.endAt?{at:S.timer.endAt,phase:S.timer.phase,name:(S.habits.find(h=>h.id===S.timer.hid)||{}).name||''}:null}}
function syncR(){if(!TG)return;clearTimeout(SY_T);SY_T=setTimeout(()=>syncNow(false),1200)}
async function syncNow(force){if(!TG)return;clearTimeout(SY_T);const p=syncPayload(),s=JSON.stringify(p);if(!force&&s===SY_LAST&&SY_ST.ok)return;
  try{const r=await api('sync',{data:p});if(r.ok){SY_LAST=s;SY_ST={ok:true,err:''}}else SY_ST={ok:false,err:r.err||'xato'}}catch(e){SY_ST={ok:false,err:'internet yoʻq'}}
  const e=document.getElementById('ss');if(e)e.textContent=syncTxt()}
const syncTxt=()=>SY_ST.ok===null?'Eslatmalar serverga ulanmoqda…':SY_ST.ok?'Eslatmalar serverda ✓ — vaqti kelganda bot xabar yuboradi.':SY_ST.err==='auth'?'Sessiya eskirgan: ilovani yopib, bot orqali qayta oching.':'Eslatmalar serverga yetmadi ('+SY_ST.err+'). Ilova keyinroq qayta urinadi.';
let tab='main',selH=null,DAYS=45,first=true;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=k=>{const[a,b,c]=k.split('-');return new Date(+a,+b-1,+c)};
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const wd=d=>(d.getDay()+6)%7,today=()=>new Date();
const sched=(h,d)=>h.days.includes(wd(d));
const get=(h,d)=>(S.logs[h.id]||{})[ds(d)];
const num=v=>Math.round(v*100)/100;
/* Katak holati: bitta manba. p — haqiqiy foiz (0..100), f — katak fonida koʻrinadigan toʻlish, s — belgi */
function cellInfo(h,d){
  const E={p:0,f:0,s:'e'},part=p=>p>=99.99?{p:100,f:0,s:'y'}:p>0?{p,f:p,s:'p'}:E;
  if(h.group){const n=h.subs?h.subs.length:0;return n?part(Math.min(100,gk(h,d)/n*100)):E}
  const c=get(h,d);if(!c)return E;
  if(c.s==='x')return{p:0,f:0,s:'x'};if(c.s==='z')return{p:0,f:0,s:'z'};
  if(h.unit&&h.goal>0)return part(Math.max(0,Math.min(100,(Number(c.v)||0)/h.goal*100)));
  return{p:100,f:0,s:'y'}}
function st(h,d){return cellInfo(h,d).s}
const SY={y:'✓',p:'✓',x:'×',z:'−',e:'×'};
function score(h,d){if(h.group){const n=h.subs.length,k=gk(h,d);return n&&k?k/n:null}const c=get(h,d);if(!c||c.s==='z')return null;if(c.s==='x')return 0;return h.unit&&h.goal?Math.min(1,(c.v||0)/h.goal):1}
function streak(h){let n=0,d=today(),f=true;for(let i=0;i<500;i++,d=addD(d,-1)){const c=get(h,d);if(!sched(h,d)&&!c)continue;if(h.group?gfull(h,d):c&&c.s==='y'&&cellInfo(h,d).p>0)n++;else if(c&&c.s==='z')continue;else if(f&&ds(d)===ds(today())){}else break;f=false}return n}
function rate(h,days=30){let a=0,k=0;for(let i=0;i<days;i++){const d=addD(today(),-i);if(!sched(h,d)&&!get(h,d))continue;const s=score(h,d);if(s===null&&!(i===0))continue;if(s===null)continue;k++;a+=s}return k?Math.round(a/k*100):0}
const fv=(h,v)=>h.unit?num(v)+' '+h.unit:'';
function applyTheme(){document.documentElement.dataset.t=S.set.theme;if(!TG)return;const bg=S.set.theme==='light'?'#ffffff':'#000000';

function seed(){
  const t=today(),key=ds(t),mk=(n,u,g,d,color,time='')=>({id:'h'+Math.random().toString(36).slice(2,9),name:n,unit:u,goal:g,days:d||[0,1,2,3,4,5,6],time,color});
  // Namunaviy odatlarni qayta-qayta bosganda bir xil nomdagi namunalar takrorlanmasin.
  const has=n=>S.habits.some(h=>h.name===n);
  const add=(h,logs={})=>{S.habits.push(h);S.logs[h.id]=logs;return h};

  // 1. Miqdor bilan kuzatiladigan oddiy odat; eslatmasiz.
  if(!has('Suv ichish')){
    const h=mk('Suv ichish','stakan',8,null,'teal');
    const L={}; for(let i=6;i>=1;i--){const d=ds(addD(t,-i));L[d]={s:i%3===0?'y':'p',v:i%3===0?8:4};}
    L[key]={s:'p',v:4}; add(h,L);
  }

  // 2. Kichik odatlardan tashkil topgan guruh; ertalabki eslatma yoqilgan.
  if(!has('Ertalabki tartib')){
    const h={id:'g'+Math.random().toString(36).slice(2,9),name:'Ertalabki tartib',unit:'',goal:0,days:[0,1,2,3,4,5,6],time:'07:00',color:'violet',group:true,subs:['Yotoqni yigʻish','Yuz-qoʻlni yuvish','Kun rejasini koʻrish'].map(n=>({id:'s'+Math.random().toString(36).slice(2,7),name:n}))};
    const L={};for(let i=6;i>=1;i--){const d=ds(addD(t,-i)),count=i%4===0?3:i%3===0?1:2,dd={};h.subs.slice(0,count).forEach(z=>dd[z.id]=1);L[d]={s:count===3?'y':'p',v:0,d:dd};}
    const dd={};h.subs.slice(0,2).forEach(z=>dd[z.id]=1);L[key]={s:'p',v:0,d:dd};add(h,L);
  }

  // 3. Biologiyani oʻrganish: soat bilan hisoblanadi va eslatmasi bor.
  if(!has('Biologiya oʻrganish')){
    const h=mk('Biologiya oʻrganish','soat',2,null,'blue','19:00'),L={};
    for(let i=6;i>=1;i--){const d=ds(addD(t,-i)),v=[1,2,1.5,0.5,2,1][i%6];L[d]={s:v>=2?'y':v>0?'p':'x',v};}
    L[key]={s:'p',v:1};add(h,L);
  }

  // 4. Vaqt bilan oʻlchanadigan odat; bugungi katakchaga namuna izohi qoʻshiladi.
  if(!has('Kitob oʻqish')){
    const h=mk('Kitob oʻqish','daqiqa',20,null,'pink'),L={};
    for(let i=6;i>=1;i--){const d=ds(addD(t,-i)),v=i%2?20:10;L[d]={s:v===20?'y':'p',v};}
    L[key]={s:'y',v:20};add(h,L);setNote(h.id,key,'Bugun 20 daqiqa kitob oʻqidim.');
  }

  // 5. Oddiy, miqdorsiz odat; kechki eslatmasiz emas, eslatmasi yoqilgan.
  if(!has('Xonani tartibga keltirish')){
    const h=mk('Xonani tartibga keltirish','',0,[0,1,2,3,4,5,6],'orange','20:30'),L={};
    for(let i=6;i>=1;i--){const d=ds(addD(t,-i));L[d]={s:i%3===0?'y':'x',v:0};}
    L[key]={s:'x',v:0};add(h,L);
  }
  save();
}

  }
  const l=left(),run=!!t.endAt,h=S.habits.find(x=>x.id===t.hid);
  return `<div class="pm"><div class="ph" style="margin-top:14px">${t.phase==='focus'?esc(h?h.name:''):'Tanaffus'}</div><div class="big" id="tt">${fmt(l)}</div><div class="bar"><i id="pb" style="width:${(1-l/t.total)*100}%"></i></div><div class="ph" style="margin:-12px 0 14px">${run?'Davom etmoqda':'Toʻxtatilgan'}</div><div class="ph" id="wl" style="margin:0 0 16px;font-size:12px;line-height:1.4">${wlMsg()}</div>
  <div class="row" style="margin-top:0">${run?'<button class="bt g2" id="ps">Toʻxtatish</button>':'<button class="bt" id="rs">Davom ettirish</button>'}${t.phase==='focus'?'<button class="bt g2" id="fn">Yakunlash</button>':'<button class="bt g2" id="sk">Oʻtkazish</button>'}<button class="bt r" id="cn">Bekor qilish</button></div></div>`;
}
function startT(hid,phase,min){S.timer={hid,phase,total:min*60,endAt:Date.now()+min*60000,rem:min*60};save()}
function ask(){if(TG){if(!WA&&tgv('6.9')&&!((TG.initDataUnsafe||{}).user||{}).allows_write_to_pm){WA=true;try{TG.requestWriteAccess(()=>{})}catch(e){}}return}
  try{if('Notification' in window&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
async function sysNote(m){try{if(TG||!('Notification' in window)||Notification.permission!=='granted')return;
  const r=navigator.serviceWorker?await navigator.serviceWorker.getRegistration():null;if(r){await r.showNotification('Odatlar',{body:m,tag:'odat-'+Date.now()});return}new Notification('Odatlar',{body:m})}catch(e){}}
function ding(m){if(TG)hap('warning');else sysNote(m);try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(o=>{const s=a.createOscillator(),g=a.createGain();s.connect(g);g.connect(a.destination);s.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+o+.2);s.start(a.currentTime+o);s.stop(a.currentTime+o+.22)})}catch(e){}
  try{if(!TG&&navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function finish(auto){
  const t=S.timer;if(!t)return;
  if(t.phase==='break'){S.timer=null;save();if(auto)ding('Tanaffus tugadi');render();return}
  const mins=auto?Math.round(t.total/60):Math.round((t.total-left())/60);S.timer=null;save();if(auto)ding('Mashgʻulot tugadi. Natijani belgilang.');
  const h=S.habits.find(x=>x.id===t.hid);render();if(mins<1||!h)return;
  const tu=h.unit==='daqiqa'||h.unit==='soat';
  modal(`<h2>${auto?'Mashgʻulot tugadi':'Mashgʻulotni yakunlash'}</h2><div class="sub">${esc(h.name)} — ${mins} daqiqa</div>${tu?`<label class="tg"><input type="checkbox" id="mk" checked> Bugungi natijaga ${mins} daqiqa qoʻshish</label>`:''}
  <div class="row"><button class="bt" id="sv">Saqlash</button>${S.set.brk>0?'<button class="bt g2" id="sb">Saqlash, tanaffus</button>':''}</div>`,()=>{
    const sv=br=>{S.sessions.push({hid:t.hid,date:ds(today()),min:mins,ts:Date.now()});
      if(tu&&$('#mk').checked){const L=S.logs[h.id]=S.logs[h.id]||{},k=ds(today()),c=L[k]||{s:'y',v:0};if(c.s!=='y')c.v=0;c.v=num((c.v||0)+(h.unit==='soat'?mins/60:mins));if(c.s!=='y')c.s='y';L[k]=c}
      if(br)startT(t.hid,'break',S.set.brk);save();close();render()};
    $('#sv').onclick=()=>sv(false);if($('#sb'))$('#sb').onclick=()=>sv(true)});
}
setInterval(()=>{const t=S.timer;if(!t||!t.endAt)return;const l=left();
  if($('#tt')){$('#tt').textContent=fmt(l);$('#pb').style.width=(1-l/t.total)*100+'%'}if($('#mt'))$('#mt').textContent=fmt(l);
  document.title=fmt(l)+' · Odatlar';if(l<=0){document.title='Odatlar';finish(true)}},400);
/* modal + bind */
function modal(h,cb){$('#md').innerHTML=`<div class="ov"><div class="sh">${h}</div></div>`;cb&&cb()}
function close(){$('#md').innerHTML=''}
function bind(){
  document.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const[i,k]=b.dataset.c.split('|');cellDlg(i,k)});
  document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{if(DRG.block)return;detail(b.dataset.d)});
  const v=(id,f)=>{const e=$(id);if(e)e.onclick=f};
  v('#sd',()=>{seed();render()});v('#gp',()=>{tab='pomo';render()});
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.set.focus=+b.dataset.f;save();render()});
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.set.brk=+b.dataset.b;save();render()});
  if($('#sel'))$('#sel').onchange=e=>{selH=e.target.value};
  if($('#cf'))$('#cf').onchange=e=>{S.set.focus=Math.min(300,Math.max(1,+e.target.value||25));save();render()};
  if($('#cb'))$('#cb').onchange=e=>{S.set.brk=Math.min(60,Math.max(0,+e.target.value||0));save();render()};
  v('#go',()=>{ask();startT(selH,'focus',S.set.focus);render()});
  v('#ps',()=>{const t=S.timer;t.rem=left();t.endAt=null;save();render()});
  v('#rs',()=>{const t=S.timer;t.endAt=Date.now()+t.rem*1000;save();render()});
  v('#fn',()=>finish(false));v('#sk',()=>{S.timer=null;save();render()});
  v('#cn',()=>cf('Taymer bekor qilinsinmi? Vaqt saqlanmaydi.',()=>{S.timer=null;save();document.title='Odatlar';render()}));
}
let lastR='';setInterval(()=>{const n=new Date(),k=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+ds(n);if(k===lastR)return;lastR=k;
  S.habits.forEach(h=>{if(h.time&&k.startsWith(h.time)&&sched(h,n)&&!get(h,n))ding('Eslatma: '+h.name)})},15000);
/* Telegram: Orqaga tugmasi va asosiy ekranga qoʻshish */
let HS=TG?'unknown':'unsupported',BB=null;
function tgBack(){if(!tgv('6.1'))return;const on=!!($('#md .ov')||$('#fm .dv')||$('#rpv')||$('#dt .dv')||tab!=='main');if(on===BB)return;BB=on;try{on?TG.BackButton.show():TG.BackButton.hide()}catch(e){}}
function tgBackClick(){if($('#md .ov'))close();else if($('#fm .dv'))fclose();else if($('#rpv'))$('#rpv').remove();else if($('#dt .dv')){DET=null;$('#dt').innerHTML=''}else if(tab!=='main'){tab='main';render()}tgBack()}
function homeAdd(){if(!tgv('8.0'))return al('Bu imkoniyat uchun Telegram ilovasini yangilang.');
  if(HS==='unsupported')return al('Bu qurilmadagi Telegram asosiy ekranga qoʻshishni qoʻllamaydi. Telefondagi Telegram’dan urinib koʻring.');
  try{TG.addToHomeScreen()}catch(e){al('Asosiy ekranga qoʻshib boʻlmadi.')}}
function hsTip(){const e=document.createElement('div');e.className='ts';e.innerHTML='📲 Ilovani telefon asosiy ekraniga qoʻshish uchun shu yerni bosing.<div class="sub">Keyinroq ham mumkin: ⋮ menyusi</div>';e.onclick=()=>{e.remove();homeAdd()};document.body.appendChild(e);setTimeout(()=>e.remove(),12000)}
if(TG){
  if(tgv('6.1')){try{TG.BackButton.onClick(tgBackClick)}catch(e){}new MutationObserver(tgBack).observe(document.body,{childList:true,subtree:true})}
  if(tgv('8.0')){const want=/[?&]home=1/.test(location.search)||(TG.initDataUnsafe||{}).start_param==='home';
    try{TG.onEvent('homeScreenAdded',()=>{HS='added';toast('Ilova telefon asosiy ekraniga qoʻshildi ✓')})}catch(e){}
    try{TG.checkHomeScreenStatus(s=>{HS=s||'unknown';
      if(want){if(HS==='added')toast('Ilova allaqachon asosiy ekranda bor ✓');else setTimeout(homeAdd,400)}
      else if(HS==='missed'){let n=0;try{n=+localStorage.getItem('odatHS')||0;localStorage.setItem('odatHS',n+1)}catch(e){}if(n===1)hsTip()}})}catch(e){}}
  else HS='unsupported';
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow(false)});
  setInterval(()=>syncNow(false),300000);
}else if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();taskTick();if(S.timer&&S.timer.endAt&&left()<=0)finish(true);if(TG){syncNow(true);tgBack()}
</script>
